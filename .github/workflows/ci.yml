name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and container smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build backend image
        run: docker build --tag planner-sync-ci:local .

      - name: Create smoke-test TLS certificate
        run: |
          mkdir -p "$RUNNER_TEMP/planner-sync-certs"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout "$RUNNER_TEMP/planner-sync-certs/planner.key" \
            -out "$RUNNER_TEMP/planner-sync-certs/planner.crt" \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost'
          chmod 644 "$RUNNER_TEMP/planner-sync-certs/planner.key" \
            "$RUNNER_TEMP/planner-sync-certs/planner.crt"

      - name: Start backend container
        run: |
          docker run --detach --name planner-sync-ci \
            --publish 8443:8443 \
            --volume "$RUNNER_TEMP/planner-sync-certs:/certs:ro" \
            --env PLANNER_SYNC_TOKEN=0123456789abcdef0123456789abcdef \
            --env PLANNER_WIDGET_TOKEN=fedcba9876543210fedcba9876543210 \
            --env PLANNER_ADDR=:8443 \
            --env PLANNER_TLS_CERT=/certs/planner.crt \
            --env PLANNER_TLS_KEY=/certs/planner.key \
            --env PLANNER_DB_PATH=/tmp/planner.db \
            planner-sync-ci:local

      - name: Wait for backend health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --insecure https://localhost:8443/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs planner-sync-ci
          exit 1

      - name: Stop backend container
        if: always()
        run: docker rm --force planner-sync-ci || true

  macos:
    name: macOS tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project PlannerApp.xcodeproj \
            -scheme PlannerApp-macOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  ios:
    name: iOS Simulator build
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build iOS app for Simulator
        run: |
          xcodebuild build \
            -project PlannerApp.xcodeproj \
            -scheme PlannerApp-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
