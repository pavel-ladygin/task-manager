services:
  planner-sync:
    build:
      context: .
      network: host
    container_name: planner-sync
    restart: unless-stopped
    network_mode: host
    environment:
      PLANNER_SYNC_TOKEN: ${PLANNER_SYNC_TOKEN:?set PLANNER_SYNC_TOKEN in .env}
      PLANNER_WIDGET_TOKEN: ${PLANNER_WIDGET_TOKEN:?set PLANNER_WIDGET_TOKEN in .env}
      PLANNER_DB_PATH: ${PLANNER_DB_PATH:-/data/planner.db}
      PLANNER_ADDR: ${PLANNER_ADDR:-:443}
      PLANNER_TLS_CERT: ${PLANNER_TLS_CERT:-/certs/planner.crt}
      PLANNER_TLS_KEY: ${PLANNER_TLS_KEY:-/certs/planner.key}
      PLANNER_TELEGRAM_ENABLED: ${PLANNER_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      PLANNER_TIMEZONE: ${PLANNER_TIMEZONE:-Europe/Moscow}
      STT_PRIMARY: ${STT_PRIMARY:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3}
      STT_FALLBACK: ${STT_FALLBACK:-none}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    volumes:
      - planner-sync-data:/data
      - ./certs:/certs:ro
    mem_limit: 256m
    cpus: "0.50"

volumes:
  planner-sync-data:
